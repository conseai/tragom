name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build backend/TravelApp.slnx -c Release

  frontend:
    name: Build web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
        env:
          NG_CLI_ANALYTICS: "false"

  images:
    name: Publish Docker images
    # Only after a merge to main, and only if both builds passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name prefix (must be lowercase)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: ${{ env.PREFIX }}/api:latest,${{ env.PREFIX }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          tags: ${{ env.PREFIX }}/web:latest,${{ env.PREFIX }}/web:${{ github.sha }}
